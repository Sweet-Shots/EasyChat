<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#2563eb" />
<title>EasyChat</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='9' fill='%232563eb'/%3E%3Cpath d='M8 11.5A2.5 2.5 0 0 1 10.5 9h11A2.5 2.5 0 0 1 24 11.5v7a2.5 2.5 0 0 1-2.5 2.5H15l-4.4 3.5a.8.8 0 0 1-1.3-.6V21h-.3A1.5 1.5 0 0 1 8 19.5Z' fill='white'/%3E%3C/svg%3E" />
<link rel="stylesheet" href="/css/styles.css" />
</head>
<body>

<!-- ───────── Sign-in ───────── -->
<section id="gate" class="gate">
  <div class="gate__glow" aria-hidden="true"></div>
  <form id="gate-form" class="gate__card" autocomplete="off">
    <div class="gate__mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" fill="none"><rect width="48" height="48" rx="14" fill="url(#g)"/><path d="M13 16.5A3.5 3.5 0 0 1 16.5 13h15a3.5 3.5 0 0 1 3.5 3.5v10a3.5 3.5 0 0 1-3.5 3.5H23l-6.2 5.1a1 1 0 0 1-1.6-.8V30h-.2A2 2 0 0 1 13 28Z" fill="#fff"/><path d="M19 19h10M19 24h6.5" stroke="#2563eb" stroke-width="2.4" stroke-linecap="round"/><defs><linearGradient id="g" x1="0" y1="0" x2="48" y2="48"><stop stop-color="#3b82f6"/><stop offset="1" stop-color="#1d4ed8"/></linearGradient></defs></svg>
    </div>
    <h1 class="gate__title">EasyChat</h1>
    <p class="gate__subtitle">Pick a name and jump in.</p>

    <label class="field">
      <span class="field__label">Username</span>
      <input id="gate-username" class="field__input" type="text" maxlength="24" placeholder="e.g. riley" required />
    </label>

    <label class="field" id="gate-password-field" hidden>
      <span class="field__label">Passcode</span>
      <input id="gate-password" class="field__input" type="password" maxlength="64" placeholder="Room passcode" />
    </label>

    <p id="gate-error" class="gate__error" role="alert" hidden></p>

    <button id="gate-submit" class="btn btn--primary btn--block" type="submit">
      <span class="btn__label">Enter chat</span>
    </button>
    <p class="gate__foot">Messages are stored on the host device only.</p>
  </form>
</section>

<!-- ───────── App ───────── -->
<main id="app" class="app" hidden>
  <div id="scrim" class="scrim" hidden></div>

  <aside id="sidebar" class="sidebar">
    <header class="sidebar__head">
      <div class="brand">
        <svg class="brand__mark" viewBox="0 0 32 32" fill="none" aria-hidden="true"><rect width="32" height="32" rx="9" fill="rgba(255,255,255,.18)"/><path d="M8 11.5A2.5 2.5 0 0 1 10.5 9h11A2.5 2.5 0 0 1 24 11.5v7a2.5 2.5 0 0 1-2.5 2.5H15l-4.4 3.5a.8.8 0 0 1-1.3-.6V21h-.3A1.5 1.5 0 0 1 8 19.5Z" fill="#fff"/><path d="M12.5 13.5h7M12.5 17h4.5" stroke="#2563eb" stroke-width="1.9" stroke-linecap="round"/></svg>
        <span class="brand__name">EasyChat</span>
      </div>
      <button id="sidebar-close" class="icon-btn icon-btn--ghost sidebar__close" type="button" aria-label="Close menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </header>

    <div class="sidebar__section">
      <div class="sidebar__label">
        <span>Rooms</span>
        <button id="new-room" class="icon-btn icon-btn--ghost icon-btn--sm" type="button" aria-label="Create a room" title="Create a room">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 6v12M6 12h12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
        </button>
      </div>
      <ul id="room-list" class="room-list"></ul>
    </div>

    <div class="sidebar__section sidebar__section--grow">
      <div class="sidebar__label"><span>In this room — <em id="member-count">0</em></span></div>
      <ul id="member-list" class="member-list"></ul>
    </div>

    <footer class="sidebar__foot">
      <div id="me-avatar" class="avatar avatar--sm">?</div>
      <div class="sidebar__me">
        <strong id="me-name">…</strong>
        <span id="conn-state" class="conn conn--live">Connected</span>
      </div>
    </footer>
  </aside>

  <section class="chat">
    <header class="chat__head">
      <button id="sidebar-open" class="icon-btn chat__menu" type="button" aria-label="Open menu">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
      <div class="chat__title">
        <h2 id="room-name">…</h2>
        <p id="room-topic" class="chat__topic"></p>
      </div>
      <div id="room-online" class="pill pill--online"><i></i><span>0 online</span></div>
    </header>

    <div id="messages" class="messages" role="log" aria-live="polite">
      <div id="messages-inner" class="messages__inner"></div>
    </div>

    <button id="jump" class="jump" type="button" hidden>
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      <span>New messages</span>
    </button>

    <div id="typing" class="typing" hidden>
      <span class="typing__dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span id="typing-text" class="typing__text"></span>
    </div>

    <footer class="composer">
      <div id="gif-attachment" class="attachment" hidden>
        <img id="gif-attachment-img" alt="" />
        <button id="gif-attachment-remove" class="attachment__remove" type="button" aria-label="Remove GIF">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </button>
      </div>
      <form id="composer-form" class="composer__bar">
        <button id="gif-btn" class="icon-btn composer__action" type="button" aria-label="Search GIFs" title="GIFs">
          <span class="gif-glyph">GIF</span>
        </button>
        <textarea id="input" class="composer__input" rows="1" maxlength="4000" placeholder="Message the room…"></textarea>
        <button id="send" class="icon-btn composer__send" type="submit" aria-label="Send message">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.4 11.2 19.1 4.6c.8-.4 1.6.4 1.3 1.2l-5.1 14.4c-.3.8-1.4.9-1.8.1l-2.8-5.1-5.2-2.6c-.8-.4-.8-1.4-.1-1.4Z" fill="currentColor"/></svg>
        </button>
      </form>
      <p class="composer__hint"><kbd>Enter</kbd> send · <kbd>Shift</kbd>+<kbd>Enter</kbd> newline<span class="composer__tips"> · <b>**bold**</b> <i>*italic*</i> <code>`code`</code> <span>&gt; quote</span> <span>||spoiler||</span></span></p>
    </footer>
  </section>
</main>

<!-- ───────── GIF picker ───────── -->
<div id="gif-panel" class="gif-panel" hidden>
  <header class="gif-panel__head">
    <input id="gif-search" class="gif-panel__search" type="search" placeholder="Search Tenor…" autocomplete="off" />
    <button id="gif-close" class="icon-btn icon-btn--ghost" type="button" aria-label="Close GIF picker">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>
  <div id="gif-results" class="gif-grid"></div>
  <p id="gif-status" class="gif-panel__status"></p>
</div>

<!-- ───────── New room dialog ───────── -->
<div id="room-modal" class="modal" hidden>
  <form id="room-form" class="modal__card">
    <h3 class="modal__title">New room</h3>
    <label class="field">
      <span class="field__label">Name</span>
      <input id="room-input" class="field__input" type="text" maxlength="40" placeholder="design-talk" required />
    </label>
    <label class="field">
      <span class="field__label">Topic <span class="field__opt">optional</span></span>
      <input id="room-topic-input" class="field__input" type="text" maxlength="120" placeholder="What is this room for?" />
    </label>
    <div class="modal__actions">
      <button id="room-cancel" class="btn btn--ghost" type="button">Cancel</button>
      <button class="btn btn--primary" type="submit">Create</button>
    </div>
  </form>
</div>

<div id="toasts" class="toasts" aria-live="polite"></div>

<script src="/js/markdown.js"></script>
<script src="/js/app.js"></script>
</body>
</html>
